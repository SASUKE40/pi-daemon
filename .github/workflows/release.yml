name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify package version matches tag
        run: |
          package_version="$(node -p 'require("./package.json").version')"
          test "v${package_version}" = "${GITHUB_REF_NAME}"

  github-release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack web daemon
        run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts
          test "$(find artifacts -maxdepth 1 -name 'edward40-pi-daemon-*.tgz' | wc -l | tr -d ' ')" = 1
      - name: Download pinned cloudflared assets
        run: |
          for asset in cloudflared-darwin-arm64.tgz cloudflared-darwin-amd64.tgz cloudflared-linux-arm64 cloudflared-linux-amd64; do
            curl -fsSLO "https://github.com/cloudflare/cloudflared/releases/download/2026.7.3/$asset"
          done
          mv cloudflared-* artifacts/
      - name: Download and verify managed Node.js assets
        run: |
          curl -fsSLO https://nodejs.org/dist/v24.19.0/SHASUMS256.txt
          for asset in node-v24.19.0-darwin-arm64.tar.gz node-v24.19.0-darwin-x64.tar.gz node-v24.19.0-linux-arm64.tar.gz node-v24.19.0-linux-x64.tar.gz; do
            curl -fsSLO "https://nodejs.org/dist/v24.19.0/$asset"
            grep "  $asset\$" SHASUMS256.txt | sha256sum -c -
          done
          mv node-v24.19.0-* artifacts/
      - name: Assemble checksummed release payload
        run: |
          cp installer/install.sh artifacts/install.sh
          cp compatibility.json artifacts/compatibility.json
          (cd artifacts && sha256sum edward40-pi-daemon-* cloudflared-* node-v24.19.0-* compatibility.json install.sh > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
