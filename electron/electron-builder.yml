appId: com.edward40.pi-daemon
productName: Pi Daemon
electronVersion: 43.3.0
artifactName: Pi-Daemon-${version}-${arch}-${os}.${ext}
asar: true
asarUnpack:
  - node_modules/@trycua/**
  - node_modules/@ubjs/**
files:
  - dist/**/*
  - public/**/*
  - package.json
  - node_modules/**/*
mac:
  icon: electron/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  entitlements: electron/entitlements.mac.plist
  entitlementsInherit: electron/entitlements.mac.plist
  extendInfo:
    LSUIElement: true
    NSAccessibilityUsageDescription: Pi Daemon needs Accessibility access to control the visible desktop when you request computer use.
    NSScreenCaptureUsageDescription: Pi Daemon needs Screen Recording access to show the desktop to the computer-use tool.
  target:
    - target: zip
      arch:
        - arm64
        - x64
afterSign: electron/notarize.mjs
